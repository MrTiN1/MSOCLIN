services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mos
      POSTGRES_USER: mos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mos -d mos"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  mos_data:
